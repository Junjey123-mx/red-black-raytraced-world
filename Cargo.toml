[package]
name = "red-black-raytraced-world"
version = "0.1.0"
edition = "2024"
# `cargo run` opens the world; the block catalog is `cargo run --bin catalog`.
default-run = "red-black-raytraced-world"

[dependencies]
raylib = "5.5"

# The CPU raytracer is unusably slow unoptimized (about 16 s per full frame),
# so `cargo run`/`cargo test` build with optimizations; debug info is kept.
[profile.dev]
opt-level = 3
